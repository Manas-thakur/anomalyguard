[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "anomalyguard"
version = "0.3.1"
description = "Data anomaly detection and remediation: ingest, validate, detect, fix, alert and monitor - algorithms built from scratch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Manas Thakur" }]
requires-python = ">=3.10"
keywords = ["anomaly-detection", "data-quality", "isolation-forest", "data-validation", "data-cleaning", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
parquet = ["pyarrow>=14"]
sql = ["sqlalchemy>=2.0"]
all = ["anomalyguard[server,parquet,sql]"]

[project.scripts]
anomalyguard = "anomalyguard.cli:main"

[project.urls]
Homepage = "https://github.com/Manas-thakur/anomalyguard"
Repository = "https://github.com/Manas-thakur/anomalyguard"
Issues = "https://github.com/Manas-thakur/anomalyguard/issues"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/anomalyguard"]
# the prebuilt web app (built from web/ with `pnpm build`); listed as artifacts so it
# ships even if a build directory is ignored by version control
artifacts = ["src/anomalyguard/monitor/static/**"]

[tool.hatch.build.targets.sdist]
include = ["src/anomalyguard", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:uvicorn.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["plans", "site", "web"]  # design documents keep their sketches; docs snippets stay as written

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # long lines are handled by the formatter
    "B008",   # function calls in defaults (FastAPI Query/Body)
    "RUF012", # mutable class attributes used as registries
    "SIM108", # ternaries are not always clearer
    "SIM105", # try/except/pass is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
