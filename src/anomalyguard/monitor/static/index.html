<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnomalyGuard</title>
  <meta name="description" content="Upload data, find anomalies with reasons, fix what is safe and review the rest.">
  <meta name="color-scheme" content="light dark">
  <script>
    // apply a saved theme before first paint (no flash)
    try { var t = localStorage.getItem("ag.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Crect width='18' height='18' rx='4' fill='%233d5bd9'/%3E%3Cpath d='M4 11.5l3-3 2.5 2.5L14 6' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="btn ghost icon-only" type="button" id="nav-toggle" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" href="#/overview">
        <svg class="brand-mark" viewBox="0 0 18 18" aria-hidden="true"><rect width="18" height="18" rx="4"/><path d="M4 11.5l3-3 2.5 2.5L14 6" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        AnomalyGuard
      </a>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/overview">
        <svg class="brand-mark" viewBox="0 0 18 18" aria-hidden="true"><rect width="18" height="18" rx="4"/><path d="M4 11.5l3-3 2.5 2.5L14 6" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        AnomalyGuard
      </a>
      <nav class="nav" id="nav">
        <a href="#/overview" data-route="overview"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>Overview</a>
        <a href="#/analyze" data-route="analyze"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>Analyze</a>
        <a href="#/runs" data-route="runs"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Runs</a>
        <a href="#/review" data-route="review"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13 7 5h10l3 8v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 13h4.5l1 2h5l1-2H20"/></svg>Review queue<span class="count" id="nav-review-count" hidden></span></a>
        <a href="#/pipelines" data-route="pipelines"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="6" height="6" rx="1.5"/><rect x="15" y="14" width="6" height="6" rx="1.5"/><path d="M9 7h3a3 3 0 0 1 3 3v4"/></svg>Pipelines</a>
        <a href="#/settings" data-route="settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Settings</a>
      </nav>
      <div class="sidebar-foot">
        <div class="segmented" role="group" aria-label="Color theme" id="theme-switch">
          <button type="button" data-theme-choice="system" aria-pressed="true">System</button>
          <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
          <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
        </div>
        <div class="meta"><span id="app-version">AnomalyGuard</span><a href="/api/docs" target="_blank" rel="noopener">API docs</a></div>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <div class="page"><div class="skeleton-block"><span class="skeleton" style="width: 30%"></span><span class="skeleton" style="width: 70%"></span></div></div>
    </main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <dialog class="modal" id="key-dialog" aria-labelledby="key-title">
    <form method="dialog" id="key-form">
      <div>
        <h2 id="key-title">API key required</h2>
        <p class="muted small" style="margin-top: 4px">This server has <code>ANOMALYGUARD_API_KEY</code> set. Enter the key once; it is kept in this browser and sent as the <code>X-API-Key</code> header.</p>
      </div>
      <label class="field"><span>API key</span><input class="input" id="key-input" type="password" autocomplete="off" required></label>
      <p class="small" id="key-error" style="color: var(--color-high)" hidden>That key was not accepted.</p>
      <div class="row" style="justify-content: flex-end"><button class="btn primary" type="submit" value="save">Continue</button></div>
    </form>
  </dialog>

  <noscript><p style="padding: 24px">AnomalyGuard needs JavaScript enabled.</p></noscript>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
