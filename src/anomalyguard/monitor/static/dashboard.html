<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnomalyGuard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --border: #e3e6eb;
    --accent: #2f6fde; --good: #1a8f55; --warn: #c07a00; --bad: #c8372d; --grid: #eceef2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1f27; --text: #e6e9ef; --muted: #98a2b3; --border: #2a313c;
      --accent: #6a9cf5; --good: #3fbf7f; --warn: #e0a43a; --bad: #ef6b60; --grid: #252b35;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  header .meta { color: var(--muted); font-size: 12px; }
  main { max-width: 1200px; margin: 0 auto; padding: 18px 16px 40px; display: grid; gap: 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .card, section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  .card { padding: 12px 14px; }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  section { padding: 14px; overflow: hidden; }
  section h2 { font-size: 14px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  svg.chart { width: 100%; height: 190px; display: block; }
  svg.chart text { fill: var(--muted); font-size: 10px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td.reason { white-space: normal; min-width: 260px; color: var(--muted); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover, tr.selected { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; border: 1px solid currentColor; }
  .ok { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); }
  button, select, input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
                          border-radius: 6px; padding: 3px 9px; }
  button { cursor: pointer; } button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  input.val { width: 90px; }
  .empty { color: var(--muted); padding: 10px 0; }
  .row-actions { display: flex; gap: 6px; }
</style>
</head>
<body>
<header>
  <h1>AnomalyGuard</h1>
  <div class="meta">
    <label>Pipeline <select id="pipeline"><option value="">all</option></select></label>
    <span id="updated"></span>
  </div>
</header>
<main>
  <div class="cards" id="cards"></div>
  <div class="charts">
    <section><h2>Anomaly rate per run</h2><svg class="chart" id="chart-rate" role="img" aria-label="Anomaly rate per run"></svg></section>
    <section><h2>Quality score per run</h2><svg class="chart" id="chart-quality" role="img" aria-label="Quality score per run"></svg></section>
  </div>
  <section>
    <h2>Runs <span class="muted" style="font-weight:400">click a run to see its anomalies</span></h2>
    <div class="table-wrap"><table id="runs"></table></div>
  </section>
  <section id="anomaly-section" hidden>
    <h2><span id="anomaly-title">Anomalies</span></h2>
    <div class="table-wrap"><table id="anomalies"></table></div>
  </section>
  <section>
    <h2>Review queue <span class="muted" id="review-counts" style="font-weight:400"></span></h2>
    <div class="table-wrap"><table id="review"></table></div>
  </section>
  <div class="charts">
    <section>
      <h2>Feedback and thresholds <button class="primary" id="tune">Tune thresholds</button></h2>
      <div class="table-wrap"><table id="thresholds"></table></div>
    </section>
    <section><h2>Recent alerts</h2><div class="table-wrap"><table id="alerts"></table></div></section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (v) => v == null ? "-" : (100 * v).toFixed(v < 0.01 && v > 0 ? 2 : 1) + "%";
const num = (v) => v == null ? "-" : Number(v).toLocaleString();
let selectedRun = null;

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(path + ": " + res.status);
  return res.json();
}
const post = (path, body) => api(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});

function lineChart(svg, points, opts) {
  const W = svg.clientWidth || 500, H = svg.clientHeight || 190, padL = 42, padR = 10, padT = 10, padB = 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  if (!points.length) { svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle">No runs yet</text>`; return; }
  const ys = points.map(p => p.y).filter(v => v != null);
  let lo = opts.min ?? Math.min(...ys), hi = opts.max ?? Math.max(...ys);
  if (hi === lo) { hi = lo + 1; }
  const x = (i) => padL + (points.length === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (points.length - 1));
  const y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  let g = "";
  for (let k = 0; k <= 4; k++) {
    const v = lo + k * (hi - lo) / 4, yy = y(v);
    g += `<line x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/>`;
    g += `<text x="${padL - 6}" y="${yy + 3}" text-anchor="end">${opts.fmt(v)}</text>`;
  }
  const path = points.map((p, i) => p.y == null ? "" : `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join("");
  g += `<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  points.forEach((p, i) => {
    if (p.y == null) return;
    g += `<circle cx="${x(i)}" cy="${y(p.y)}" r="3" fill="var(--accent)"><title>run #${p.id}: ${opts.fmt(p.y)}</title></circle>`;
  });
  const step = Math.max(1, Math.ceil(points.length / 8));
  points.forEach((p, i) => { if (i % step === 0) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">#${p.id}</text>`; });
  svg.innerHTML = g;
}

function statusPill(s) {
  const cls = s === "success" ? "ok" : s === "failed" ? "bad" : "warn";
  return `<span class="pill ${cls}">${esc(s)}</span>`;
}
function qualityClass(q) { return q == null ? "muted" : q >= 0.95 ? "ok" : q >= 0.85 ? "warn" : "bad"; }

async function loadSummary() {
  const s = await api("/api/summary");
  const sel = $("pipeline"), current = sel.value;
  sel.innerHTML = `<option value="">all</option>` + s.pipelines.map(p => `<option ${p === current ? "selected" : ""}>${esc(p)}</option>`).join("");
  const cards = [
    ["Runs", num(s.runs) + (s.failed_runs ? ` <span class="bad" style="font-size:12px">(${s.failed_runs} failed)</span>` : "")],
    ["Rows processed", num(s.rows_processed)],
    ["Anomalies found", num(s.anomalies_found)],
    ["Avg quality", `<span class="${qualityClass(s.avg_quality_score)}">${pct(s.avg_quality_score)}</span>`],
    ["Pending reviews", num(s.review.pending)],
    ["Alerts sent", num(s.alerts_sent)],
  ];
  $("cards").innerHTML = cards.map(([l, v]) => `<div class="card"><div class="label">${l}</div><div class="value">${v}</div></div>`).join("");
  $("review-counts").textContent = `${s.review.pending} pending, ${s.review.approved} approved, ${s.review.rejected} rejected`;
}

async function loadRuns() {
  const p = $("pipeline").value;
  const runs = await api("/api/runs?limit=200" + (p ? "&pipeline=" + encodeURIComponent(p) : ""));
  const chron = runs.slice().reverse().filter(r => r.status === "success");
  lineChart($("chart-rate"), chron.map(r => ({id: r.id, y: r.anomaly_rate})), {min: 0, fmt: (v) => pct(v)});
  lineChart($("chart-quality"), chron.map(r => ({id: r.id, y: r.quality_score})), {max: 1, fmt: (v) => pct(v)});
  if (!runs.length) { $("runs").innerHTML = `<tr><td class="empty">No runs yet. Try: anomalyguard run examples/pipeline.yaml</td></tr>`; return; }
  $("runs").innerHTML = `<tr><th>#</th><th>Pipeline</th><th>Started (UTC)</th><th>Status</th><th class="num">Rows</th><th class="num">Anomalies</th><th class="num">Rate</th><th class="num">Quality</th><th class="num">Fixed cells</th><th class="num">Flagged</th><th class="num">Alerts</th><th class="num">ms</th></tr>` +
    runs.map(r => `<tr class="clickable ${r.id === selectedRun ? "selected" : ""}" data-run="${r.id}">
      <td>${r.id}</td><td>${esc(r.pipeline)}</td><td>${esc((r.started_at || "").replace("T", " ").slice(0, 19))}</td>
      <td>${statusPill(r.status)}${r.error ? ` <span class="bad" title="${esc(r.error)}">!</span>` : ""}</td>
      <td class="num">${num(r.rows)}</td><td class="num">${num(r.n_anomalies)}</td><td class="num">${pct(r.anomaly_rate)}</td>
      <td class="num ${qualityClass(r.quality_score)}">${pct(r.quality_score)}</td><td class="num">${num(r.cells_changed)}</td>
      <td class="num">${num(r.flagged_for_review)}</td><td class="num">${num(r.alerts_sent)}</td><td class="num">${r.duration_ms == null ? "-" : Math.round(r.duration_ms)}</td></tr>`).join("");
  document.querySelectorAll("#runs tr[data-run]").forEach(tr => tr.onclick = () => showRun(Number(tr.dataset.run)));
}

async function showRun(id) {
  selectedRun = id;
  document.querySelectorAll("#runs tr[data-run]").forEach(tr => tr.classList.toggle("selected", Number(tr.dataset.run) === id));
  const rows = await api(`/api/runs/${id}/anomalies?limit=300`);
  $("anomaly-section").hidden = false;
  $("anomaly-title").textContent = `Anomalies in run #${id} (${rows.length} shown, highest score first)`;
  if (!rows.length) { $("anomalies").innerHTML = `<tr><td class="empty">No anomalies recorded for this run.</td></tr>`; return; }
  $("anomalies").innerHTML = `<tr><th>Row</th><th>Column</th><th>Value</th><th>Detector</th><th class="num">Score</th><th>Reason</th><th>Feedback</th></tr>` +
    rows.map(a => `<tr><td>${esc(a.row_index)}</td><td>${esc(a.column || "-")}</td><td>${esc(a.value)}</td><td>${esc(a.detector)}</td>
      <td class="num">${Number(a.score).toFixed(2)}</td><td class="reason">${esc(a.reason)}</td>
      <td class="row-actions"><button data-fb="false_positive" data-id="${a.id}">False positive</button><button data-fb="true_positive" data-id="${a.id}">Confirm</button></td></tr>`).join("");
  document.querySelectorAll("#anomalies button[data-fb]").forEach(b => b.onclick = async () => {
    await post("/api/feedback", {anomaly_id: Number(b.dataset.id), label: b.dataset.fb});
    b.parentElement.innerHTML = `<span class="${b.dataset.fb === "true_positive" ? "ok" : "warn"}">${b.dataset.fb.replace("_", " ")}</span>`;
    loadThresholds();
  });
}

async function loadReview() {
  const items = await api("/api/review?status=pending&limit=200");
  if (!items.length) { $("review").innerHTML = `<tr><td class="empty">Nothing waiting for review.</td></tr>`; return; }
  $("review").innerHTML = `<tr><th>#</th><th>Pipeline</th><th>Row</th><th>Column</th><th>Value</th><th>Suggestion</th><th>Reason</th><th>Decision</th></tr>` +
    items.map(i => `<tr><td>${i.id}</td><td>${esc(i.pipeline || "-")}</td><td>${esc(i.row_index)}</td><td>${esc(i.column || "-")}</td><td>${esc(i.value)}</td>
      <td>${i.suggestion == null ? "-" : esc(i.suggestion) + (i.suggestion_confidence != null ? ` <span class="muted">(${Math.round(100 * i.suggestion_confidence)}%)</span>` : "")}</td>
      <td class="reason">${esc(i.reason)}</td>
      <td class="row-actions"><input class="val" placeholder="value" data-val="${i.id}"><button data-approve="${i.id}">Approve</button><button data-reject="${i.id}">Reject</button></td></tr>`).join("");
  document.querySelectorAll("#review button[data-approve]").forEach(b => b.onclick = async () => {
    const raw = document.querySelector(`input[data-val="${b.dataset.approve}"]`).value.trim();
    const value = raw === "" ? null : (isNaN(Number(raw)) ? raw : Number(raw));
    await post(`/api/review/${b.dataset.approve}/approve`, {value}); refresh();
  });
  document.querySelectorAll("#review button[data-reject]").forEach(b => b.onclick = async () => { await post(`/api/review/${b.dataset.reject}/reject`); refresh(); });
}

async function loadThresholds() {
  const [fb, th] = await Promise.all([api("/api/feedback"), api("/api/thresholds")]);
  const dets = new Set([...Object.keys(fb.precision), ...th.map(t => t.detector)]);
  if (!dets.size) { $("thresholds").innerHTML = `<tr><td class="empty">No feedback yet. Mark anomalies as false positives to tune thresholds.</td></tr>`; return; }
  const mult = Object.fromEntries(th.map(t => [t.detector, t]));
  $("thresholds").innerHTML = `<tr><th>Detector</th><th class="num">Confirmed</th><th class="num">False pos.</th><th class="num">Precision</th><th class="num">Threshold x</th></tr>` +
    [...dets].map(d => { const p = fb.precision[d] || {true_positive: 0, false_positive: 0, precision: null};
      return `<tr><td>${esc(d)}</td><td class="num">${p.true_positive}</td><td class="num">${p.false_positive}</td><td class="num">${pct(p.precision)}</td>
      <td class="num" title="${esc(mult[d]?.reason || "")}">${mult[d] ? Number(mult[d].multiplier).toFixed(2) : "1.00"}</td></tr>`; }).join("");
}

async function loadAlerts() {
  const al = await api("/api/alerts?limit=20");
  if (!al.length) { $("alerts").innerHTML = `<tr><td class="empty">No alerts.</td></tr>`; return; }
  const cls = {critical: "bad", error: "bad", warning: "warn", info: "muted", debug: "muted"};
  $("alerts").innerHTML = `<tr><th>Time</th><th>Severity</th><th>Alert</th><th>Status</th></tr>` +
    al.map(a => `<tr><td>${esc((a.created_at || "").replace("T", " ").slice(0, 19))}</td><td><span class="pill ${cls[a.severity] || ""}">${esc(a.severity)}</span></td>
      <td class="reason">${esc(a.title)}</td><td>${esc(a.status)}</td></tr>`).join("");
}

async function refresh() {
  try {
    await loadSummary();
    await Promise.all([loadRuns(), loadReview(), loadThresholds(), loadAlerts()]);
    if (selectedRun) await showRun(selectedRun);
    $("updated").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) { $("updated").textContent = "error: " + e.message; }
}
$("pipeline").onchange = loadRuns;
$("tune").onclick = async () => { const r = await post("/api/feedback/tune"); loadThresholds();
  alert(r.changes.length ? r.changes.map(c => `${c.detector}: x${c.old} -> x${c.new}`).join("\n") : "No changes: need at least 3 new reviews per detector with precision below 80%."); };
window.addEventListener("resize", loadRuns);
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
