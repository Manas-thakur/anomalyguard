name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # overrides .python-version for every uv command in this job
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      - name: CLI smoke test
        run: |
          uv run anomalyguard doctor
          uv run anomalyguard detect examples/data/orders.csv --group-by region --top 3
          uv run anomalyguard run examples/pipeline.yaml
          uv run anomalyguard demo benchmark --datasets sensor

  web:
    # the React app in web/ is built into src/anomalyguard/monitor/static and the
    # output is committed (pip installs need no Node); this job checks it is current
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Colour contrast (WCAG AA)
        run: pnpm contrast

      - name: Build
        run: pnpm build

      - name: Committed build is up to date
        working-directory: .
        run: |
          git add -N src/anomalyguard/monitor/static
          git diff --exit-code --stat src/anomalyguard/monitor/static || {
            echo "::error::src/anomalyguard/monitor/static is out of date: run 'pnpm build' in web/ and commit the result"
            exit 1
          }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build
      - name: Wheel ships the web app
        run: |
          unzip -l dist/*.whl | grep -q "anomalyguard/monitor/static/index.html"
          unzip -l dist/*.whl | grep -q "anomalyguard/monitor/static/assets/.*\.js"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t anomalyguard:ci .
      - name: Smoke test image
        run: docker run --rm anomalyguard:ci detect examples/data/orders.csv --top 3
