name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # overrides .python-version for every uv command in this job
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      - name: CLI smoke test
        run: |
          uv run anomalyguard detect examples/data/orders.csv --group-by region --top 3
          uv run anomalyguard run examples/pipeline.yaml
          uv run anomalyguard demo benchmark --datasets sensor

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t anomalyguard:ci .
      - name: Smoke test image
        run: docker run --rm anomalyguard:ci detect examples/data/orders.csv --top 3
