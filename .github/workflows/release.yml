name: Release

# Runs when a version tag is pushed:  git tag v0.3.0 && git push origin v0.3.0
#
# 1. test   - lint + tests (same as CI) and a check that the tag matches the package version
# 2. build  - web app (pnpm build into the package), then sdist + wheel, uploaded as a workflow artifact
# 3. github - GitHub Release with the sdist/wheel attached and the CHANGELOG section as notes
# 4. docker - multi-arch image pushed to ghcr.io/manas-thakur/anomalyguard (GITHUB_TOKEN)
# 5. pypi   - PyPI trusted publishing; skipped unless the repository variable
#             PYPI_PUBLISH is set to "true" (see "Publishing to PyPI" in the README)

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/manas-thakur/anomalyguard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Tag matches package version
        run: |
          version=$(uv run python -c "import anomalyguard; print(anomalyguard.__version__)")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the web app into the package
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke test the wheel
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env "$(ls dist/*.whl)[server]"
          /tmp/wheel-env/bin/anomalyguard --version
          /tmp/wheel-env/bin/anomalyguard doctor
          /tmp/wheel-env/bin/python -c "import anomalyguard.monitor.api as a; assert (a.STATIC_DIR / 'index.html').exists(); assert any((a.STATIC_DIR / 'assets').glob('*.js'))"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Release ${GITHUB_REF_NAME}" > release-notes.md; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AnomalyGuard ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pypi:
    needs: build
    # Off until PyPI trusted publishing is configured; then set the repository
    # variable PYPI_PUBLISH=true (Settings > Secrets and variables > Actions > Variables).
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/anomalyguard/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
